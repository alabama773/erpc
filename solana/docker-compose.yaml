# Solana failover gateway - runs in the background.
#
#   docker compose up -d --build   # build + start in background
#   docker compose logs -f         # watch logs
#   docker compose ps              # status
#   docker compose down            # stop + remove
#   docker compose restart         # restart
#
# The Helius key is injected at runtime from ./.env (env_file) - it is NOT
# baked into the image. Keep .env out of git (already in .gitignore).

services:
  solana-gateway:
    build: .
    image: solana-failover-gateway
    container_name: solana-gateway
    restart: unless-stopped
    ports:
      - "4100:4100"
    env_file:
      - .env
    environment:
      PORT: "4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
